name: Build iOS (no codesign)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build Runner.app
    runs-on: macos-14
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Install CocoaPods if missing
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi

      - name: Scaffold iOS native project if missing
        run: |
          if [ ! -d "ios/Runner.xcodeproj" ] || [ ! -d "ios/Runner.xcworkspace" ]; then
            echo "::warning::iOS scaffold missing, regenerating via flutter create"
            flutter create . \
              --platforms=ios \
              --org=com.nutrivision \
              --project-name=nutrivision_ai
          else
            echo "iOS scaffold present, skipping flutter create"
          fi

      - name: Merge Info.plist permissions (idempotent)
        run: |
          PLIST=ios/Runner/Info.plist
          ensure() {
            /usr/libexec/PlistBuddy -c "Delete :$1" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 string '$2'" "$PLIST"
          }
          ensure NSCameraUsageDescription "NutriVision AI uses your camera to scan meals and barcodes."
          ensure NSPhotoLibraryUsageDescription "NutriVision AI reads meal photos for AI calorie analysis."
          ensure NSPhotoLibraryAddUsageDescription "NutriVision AI saves captured meal photos to your library."

      - name: flutter clean (nuke stale .dart_tool kernel snapshot)
        run: flutter clean

      - name: Move .env out of source tree before build
        run: |
          if [ -f .env ]; then
            mv .env .env.bak
          fi

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze (fail-fast Dart check)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: flutter build ios (release, no codesign)
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=GEMINI_API_KEY="$GEMINI_API_KEY"

      - name: Restore .env
        if: always()
        run: |
          if [ -f .env.bak ]; then
            mv .env.bak .env
          fi

      - name: Verify Runner.app exists
        run: |
          test -d build/ios/iphoneos/Runner.app && \
          echo "OK Runner.app built" || \
          (echo "FAIL Runner.app missing" && exit 1)

      - name: Upload Runner.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Runner-app-${{ github.sha }}
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
