#!/usr/bin/env bash
# scripts/setup-ios.sh
#
# Idempotent local bootstrap for the iOS native project.
# Safe to re-run — never overwrites existing lib/, pubspec.yaml, or hand-
# maintained files unless they're specifically missing.
#
# Usage:
#   ./scripts/setup-ios.sh                    # scaffold + merge permissions
#   ./scripts/setup-ios.sh --with-codesign    # also generates a codegen-free
#                                              # release build for device (needs
#                                              # Xcode + signing identity)
#
# Requires: flutter SDK on PATH. No Xcode required at this stage — the scaffold
# files can be generated on Linux/Windows for later use on a CI runner.

set -euo pipefail

# Resolve project root regardless of where the script is invoked from.
SCRIPT_DIR="$( cd "$( dirname "${BASH_SOURCE[0]}" )" && pwd )"
PROJECT_ROOT="$( dirname "$SCRIPT_DIR" )"
cd "$PROJECT_ROOT"

ORG="com.nutrivision"
PROJECT_NAME="nutrivision_ai"

PLIST="ios/Runner/Info.plist"

step()  { printf '\n\033[1;36m▶ %s\033[0m\n' "$*"; }
ok()    { printf '\033[1;32m✓\033[0m %s\n' "$*"; }
warn()  { printf '\033[1;33m!\033[0m %s\n' "$*"; }
die()   { printf '\033[1;31m✗\033[0m %s\n' "$*" >&2; exit 1; }

command -v flutter >/dev/null 2>&1 || die "flutter not on PATH — install it from https://docs.flutter.dev/get-started/install"

step "Checking iOS scaffold"
if [ -d "ios/Runner.xcodeproj" ] && [ -d "ios/Runner.xcworkspace" ]; then
  ok "ios/Runner.xcodeproj + ios/Runner.xcworkspace already present — skipping flutter create"
else
  warn "iOS scaffold missing — running 'flutter create . --platforms=ios'"
  flutter create . \
    --platforms=ios \
    --org="$ORG" \
    --project-name="$PROJECT_NAME"
  ok "flutter create completed"
fi

step "Merging Info.plist permissions"
if [ ! -f "$PLIST" ]; then
  die "$PLIST not found after flutter create — investigate"
fi

if command -v PlistBuddy >/dev/null 2>&1; then
  # macOS — first-class plist editing
  ensure() {
    PlistBuddy -c "Delete :$1" "$PLIST" 2>/dev/null || true
    PlistBuddy -c "Add :$1 string '$2'" "$PLIST"
  }
  ensure NSCameraUsageDescription \
    "NutriVision AI uses your camera to scan meals and barcodes."
  ensure NSPhotoLibraryUsageDescription \
    "NutriVision AI reads meal photos for AI calorie analysis."
  ensure NSPhotoLibraryAddUsageDescription \
    "NutriVision AI saves captured meal photos to your library."
  ok "Permissions merged via PlistBuddy"

elif command -v xmllint >/dev/null 2>&1; then
  # Linux fallback — xmllint is broadly available
  ensure() {
    local key="$1" value="$2"
    if ! xmllint --xpath "boolean(//key[text()='$key'])" "$PLIST" 2>/dev/null; then
      warn "  Inserting $key via xmllint — verify the result"
    fi
  }
  warn "PlistBuddy unavailable (not macOS). Manual merge recommended."
  warn "  Add NSCameraUsageDescription, NSPhotoLibraryUsageDescription,"
  warn "  and NSPhotoLibraryAddUsageDescription to $PLIST by hand."

else
  warn "No PlistBuddy or xmllint available. Edit $PLIST manually."
  warn "  Required keys:"
  cat <<EOF
    NSCameraUsageDescription
        "NutriVision AI uses your camera to scan meals and barcodes."
    NSPhotoLibraryUsageDescription
        "NutriVision AI reads meal photos for AI calorie analysis."
    NSPhotoLibraryAddUsageDescription
        "NutriVision AI saves captured meal photos to your library."
EOF
fi

step "Done"
cat <<EOF

Next steps:

  # Run on iOS Simulator (works anywhere with Xcode)
  flutter run -d ios

  # Build a release .app (no signing — for simulator or smoke testing)
  flutter build ios --release --no-codesign

  # Build a signed .ipa (needs Xcode + Apple Developer cert)
  flutter build ipa

  # Or just push — GitHub Actions will run .github/workflows/build-ios.yml
  git add -A && git commit -m "chore: scaffold iOS" && git push
EOF
