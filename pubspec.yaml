name: nutrivision_ai
description: NutriVision AI — intelligent calorie & macro tracker with AI food vision, barcode lookup, and personalized weight-loss meal planning.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  http: ^1.2.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Camera / scanning
  # mobile_scanner is reserved for live barcode capture — currently exposed
  # through a manual-entry fallback because the iOS Simulator has no camera.
  mobile_scanner: ^5.2.3

  # Typography & UI
  google_fonts: ^6.2.1

  # Configuration / secrets
  # flutter_dotenv reads `.env` at app start so local keys never touch
  # --dart-define, shell history, or launch configs. The committed template
  # is `.env.example`; the real `.env` is gitignored.
  flutter_dotenv: ^5.2.1

  # Utility
  intl: ^0.19.0
  uuid: ^4.4.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # Local secrets — gitignored, never committed. See README.md.
    - .env
    # Bundled canned data directory (currently empty placeholder).
    - assets/data/
